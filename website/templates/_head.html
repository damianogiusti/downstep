<!doctype html>
<html lang="{{ @lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ @canonical }}">
{{ @hreflang }}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Downstep">
<meta property="og:locale" content="{{ common.og_locale }}">
<meta property="og:url" content="{{ @canonical }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:image" content="{{ @base }}assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ @base }}assets/og-card.png">
{{ @jsonld }}
<meta name="theme-color" content="#0F1114" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FAF6F0" media="(prefers-color-scheme: light)">
<link rel="icon" href="{{ @root }}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{ @root }}favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="{{ @root }}favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="{{ @root }}apple-touch-icon.png">
<link rel="apple-touch-icon" href="{{ @root }}apple-touch-icon-167.png" sizes="167x167">
<link rel="apple-touch-icon" href="{{ @root }}apple-touch-icon-152.png" sizes="152x152">
<link rel="mask-icon" href="{{ @root }}safari-pinned-tab.svg" color="#F2A541">
<link rel="manifest" href="{{ @root }}site.webmanifest">
<meta name="msapplication-config" content="{{ @root }}browserconfig.xml">
<link rel="preload" href="{{ @root }}assets/fonts/space_grotesk_bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ @root }}style.css">
<script>(function () {
  // The theme chosen with the toggle lasts 5 minutes from the last page view, then the system decides again.
  try {
    var t = JSON.parse(localStorage.getItem("sd-theme"));
    if (t && Date.now() - t.at < 5 * 60 * 1000) {
      document.documentElement.dataset.theme = t.value;
      localStorage.setItem("sd-theme", JSON.stringify({ value: t.value, at: Date.now() }));
    } else localStorage.removeItem("sd-theme");
  } catch (e) { localStorage.removeItem("sd-theme"); }
})();
(function () {
  // English pages follow the language chosen with the toggle, or else the browser. Italian pages never move.
  if ("{{ @lang }}" !== "en") return;
  var l = localStorage.getItem("sd-lang") || (navigator.languages && navigator.languages[0]) || navigator.language || "";
  if (/^it\b/i.test(l)) location.replace("{{ @alt }}" + location.hash);
})();</script>
</head>
<body>
<a class="skip" href="#main">{{ common.skip }}</a>
