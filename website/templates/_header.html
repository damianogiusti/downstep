<header class="site-head">
  <div class="wrap head-row">
    <a class="brand" href="{{ @url:home }}"><img src="{{ @root }}assets/icon.svg" alt="" width="30" height="30">Downstep</a>
    {{ page.nav }}
    <div class="tools">
      <button class="toggle" id="theme" type="button" aria-label="{{ common.theme }}">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="toggle" href="{{ @alt }}" data-lang="{{ @altlang }}" hreflang="{{ @altlang }}" lang="{{ @altlang }}" title="{{ common.other_language }}">{{ common.other_code }}</a>
      {{ page.cta }}
    </div>
  </div>
</header>
