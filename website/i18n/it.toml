note_title = "Perché l'ho fatta"
note_text = '''
<p>Suono la chitarra in una band, e per imparare i pezzi nuovi rallento e ripeto in loop i passaggi difficili. Volevo qualcosa di semplice, che funzionasse offline e che tutta la band potesse usare con gli stessi preset. Così ho fatto Downstep nel tempo libero.</p>
        <p>È gratis, e <a href="{{ @url:why }}">qui spiego perché</a>.</p>'''

faq_title = 'Domande'
faq = '''
<details><summary>È davvero gratis?{{ @icon:expand_more }}</summary>
        <p>Sì, e non c'è una versione a pagamento. Se ti piace, puoi <a href="{{ @url:why }}">sostenerla con una donazione</a>.</p></details>
      <details><summary>Dove vengono salvati i brani?{{ @icon:expand_more }}</summary>
        <p>Sul tuo computer: <code>~/Library/Application Support/SlowDowner</code> su Mac, <code>%APPDATA%\SlowDowner</code> su Windows. La cartella ha ancora il primo nome dell'app. Per spostare i brani su un altro computer, usa il backup.</p></details>
      <details><summary>Perché macOS la blocca?{{ @icon:expand_more }}</summary>
        <p>Perché non è distribuita tramite l'App Store. Basta autorizzarla una volta, la <a href="{{ @url:mac }}">pagina di download</a> spiega come. In futuro arriverà anche sull'App Store, e questo passaggio non servirà più.</p></details>
      <details><summary>L'app manda dei dati?{{ @icon:expand_more }}</summary>
        <p>No. Va online solo quando importi da un link.</p></details>
      <details><summary>Funziona su un Mac Intel?{{ @icon:expand_more }}</summary>
        <p>Per ora no, solo su Apple silicon (M1 e successivi).</p></details>
      <details><summary>C'è una versione per iPhone o Android?{{ @icon:expand_more }}</summary>
        <p>Per ora no. Mi piacerebbe fare una versione per iPhone, ma non c'è ancora una data.</p></details>
      <details><summary>Posso importare da YouTube?{{ @icon:expand_more }}</summary>
        <p>Sì, incolli un link e l'app salva solo l'audio. Scaricare da YouTube può andare contro i suoi termini di servizio, quindi usalo solo per contenuti di cui hai i diritti.</p></details>
      <details><summary>Ho trovato un bug, o ho un'idea{{ @icon:expand_more }}</summary>
        <p>Apri una issue su <a href="https://github.com/damianogiusti/downstep/issues">GitHub</a>, le leggo tutte.</p></details>'''
