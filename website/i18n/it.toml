[why]
title = 'Perché Downstep è gratis'
description = 'Perché Downstep è gratis, e come puoi sostenerla con una donazione.'
nav = ''
cta = '<a class="btn btn-primary btn-small head-cta" href="#donate">Dona</a>'
h1 = 'Perché Downstep è gratis'
text = '''
<p>Downstep è nata come app Android per il mio telefono. Volevo metterla sull'App Store e su Google Play a pochi euro, da pagare una volta sola. Poi ho guardato cosa vuol dire in Italia, dove vivo. Per venderne anche solo qualche copia mi servirebbero la partita IVA, un commercialista e una fattura ad Apple e a Google ogni mese. Per una cosa che faccio nel tempo libero, non ne valeva la pena.</p>
  <p>Così ho deciso di regalarla, e mi sono dedicato alle versioni desktop per Mac e Windows. Per metterci meno tempo mio, ho usato strumenti di AI per buona parte del lavoro, e pubblico l'app solo su questo sito.</p>
  <p>Se Downstep ti è utile e ti va di ringraziarmi, puoi farmi una donazione su PayPal. Grazie!</p>'''
donate_button = 'Dona con PayPal'
donate_note = "È un regalo: l'app resta gratis e uguale per tutti."
