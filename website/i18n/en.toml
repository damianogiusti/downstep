what_title = 'What it does'
f1_tag = 'Speed and pitch'
f1_title = 'Speed and pitch, separately'
f1_text = "You can go from 25% to 200% of the original speed, and move the key up to 12 semitones up or down. Changing one doesn't touch the other, so you can slow a song down and put it in your vocal range at the same time."
f1_alt = 'Speed at 75% and pitch at minus 2 semitones, each with a slider and step buttons'
f2_title = 'A-B loop'
f2_text = 'Press A and B while the song plays, or drag the markers on the timeline. The buttons next to them halve or double the loop, or move it to the next phrase.'
f2_alt = 'The timeline with markers A and B, and the loop controls'
f3_tag = 'Library'
f3_title = 'Your songs, offline'
f3_text = 'Import MP3, M4A, WAV or FLAC files, or a YouTube link (only for content you have the rights to). Everything is saved on your computer, so you can practice without a connection. You can also group songs in playlists.'
