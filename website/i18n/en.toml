<li class="row"><span class="tile">1</span><div><b>Open the .dmg</b><p>and drag Downstep into Applications.</p></div></li>
      <li class="row"><span class="tile">2</span><div><b>Open Downstep</b><p>The first time, macOS blocks it because it doesn't come from the App Store. Close the message.</p></div></li>
      <li class="row"><span class="tile">3</span><div><b>Go to System Settings, Privacy and Security</b><p>Scroll down and click “Open Anyway” next to Downstep. macOS asks for your password or Touch ID.</p></div></li>
      <li class="row"><span class="tile">4</span><div><b>That's it</b><p>From now on it opens normally. When a new version comes out, Downstep offers it and updates itself: you don't need to repeat these steps.</p></div></li>'''
