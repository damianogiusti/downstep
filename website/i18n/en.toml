download_title = 'Download'
mac_req = 'A Mac with Apple silicon (M1 or later) and macOS 11 or later.'
win_req = 'Windows 10 or 11, 64-bit.'

note_title = 'Why I made it'
note_text = '''
<p>I play guitar in a band, and to learn new songs I slow down the hard parts and loop them. I wanted something simple, that works offline and that everyone in the band can use with the same presets. So I made Downstep in my free time.</p>
        <p>It's free, and <a href="{{ @url:why }}">here I explain why</a>.</p>'''

faq_title = 'Questions'
faq = '''
<details><summary>Is it really free?{{ @icon:expand_more }}</summary>
        <p>Yes, and there is no paid version. If you like it, you can <a href="{{ @url:why }}">support it with a donation</a>.</p></details>
      <details><summary>Where are my songs saved?{{ @icon:expand_more }}</summary>
        <p>On your computer: <code>~/Library/Application Support/SlowDowner</code> on Mac, <code>%APPDATA%\SlowDowner</code> on Windows. The folder still has the app's first name. To move your songs to another computer, use the backup.</p></details>
      <details><summary>Why does macOS block it?{{ @icon:expand_more }}</summary>
        <p>Because it isn't distributed through the App Store. You only need to allow it once, the <a href="{{ @url:mac }}">download page</a> explains how. In the future it will come to the App Store too, and this step won't be needed anymore.</p></details>
      <details><summary>Does it work on an Intel Mac?{{ @icon:expand_more }}</summary>
        <p>Not for now, only on Apple silicon (M1 and later).</p></details>
      <details><summary>Is there an iPhone or Android version?{{ @icon:expand_more }}</summary>
        <p>Not for now. I'd like to make an iPhone version, but there is no date yet.</p></details>
      <details><summary>Can I import from YouTube?{{ @icon:expand_more }}</summary>
        <p>Yes, paste a link and the app saves only the audio. Downloading from YouTube can be against its terms of service, so use it only for content you have the rights to.</p></details>
      <details><summary>I found a bug, or I have an idea{{ @icon:expand_more }}</summary>
        <p>Open an issue on <a href="https://github.com/damianogiusti/downstep/issues">GitHub</a>, I read them all.</p></details>'''
closing = 'Download Downstep'

