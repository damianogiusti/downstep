[why]
title = 'Why Downstep is free'
description = 'Why Downstep is free, and how you can support it with a donation.'
nav = ''
cta = '<a class="btn btn-primary btn-small head-cta" href="#donate">Donate</a>'
h1 = 'Why Downstep is free'
text = '''
<p>Downstep started as an Android app for my phone. I wanted to put it on the App Store and Google Play for a few euros, paid once. Then I looked into what that means in Italy, where I live. To sell even a few copies I would need a partita IVA, an accountant, and an invoice to Apple and Google every month. For something I do in my free time, it wasn't worth it.</p>
  <p>So I decided to give it away, and I moved on to the desktop versions for Mac and Windows. To spend less of my own time on it, I used AI tools for a big part of the work, and I publish the app only on this site.</p>
  <p>If Downstep is useful to you and you'd like to say thanks, you can send me a donation on PayPal. Thank you!</p>'''
donate_button = 'Donate with PayPal'
donate_note = "It's a gift: the app stays free and the same for everyone."
more_link = 'More about the Italian bureaucracy, and how it works in other countries'

[more]
title = 'Selling an app in Italy, the details'
description = 'What it takes to sell a small app from Italy, compared with the USA, the UK, Germany, France and Spain.'
nav = ''
cta = '<a class="btn btn-primary btn-small head-cta" href="{{ @url:why }}#donate">Donate</a>'
back = 'Why Downstep is free'
h1 = 'Selling an app in Italy, the details'
meta = 'What I found in October 2026. The sources are at the bottom.'
italy_title = 'What it takes in Italy'
sum = '''
<div class="surface"><b>35 €</b><span>more or less in fees to open, plus the accountant</span></div>
      <div class="surface"><b>300 €</b><span>or more a year for the accountant, up to 1.200 €</span></div>
      <div class="surface"><b>Monthly</b><span>an e-invoice to each store</span></div>'''
start_title = 'To start'
start = '''
<li><span><b>Open a partita IVA</b> as a ditta individuale, because selling your own app counts as a commercial activity (ATECO 58.29.00). <span class="cost">About 35 €</span> <sup>[1][2]</sup></span></li>
        <li><span><b>Register with the Registro Imprese</b> through ComUnica. You need a PEC address and a digital signature. <sup>[3]</sup></span></li>
        <li><span><b>Ask INPS for the exemption</b> as a full-time employee, or there is a fixed yearly contribution. You have to declare it yourself. <sup>[4]</sup></span></li>
        <li><span><b>Register in VIES</b>, because you sell to Apple and Google in Ireland. <sup>[5]</sup></span></li>
        <li><span><b>Pick a tax regime.</b> The simple one (forfettario) is not allowed if you earned more than 35.000 € as an employee the year before. <sup>[6][7]</sup></span></li>'''
often_title = 'Every month or quarter'
often = '''
<li><span><b>An e-invoice through SdI</b> to Apple and Google, usually one for each monthly payout. <sup>[8]</sup></span></li>
        <li><span><b>A 2 € stamp duty</b> on the invoices above 77,47 €. <sup>[9]</sup></span></li>
        <li><span><b>INTRA lists</b> for the services you sell to EU companies, every quarter. <sup>[10]</sup></span></li>'''
yearly_title = 'Every year, even with no sales'
yearly = '''
<li><span><b>Accountant</b>, from 300 to 1.200 € <sup>[11]</sup></span></li>
        <li><span><b>Chamber of Commerce fee</b>, from 44 to 53 € <sup>[12]</sup></span></li>
        <li><span><b>PEC and digital signature</b>, about 30 to 50 € <sup>[13]</sup></span></li>
        <li><span><b>Tax return</b> and payments in June and November.</span></li>'''
stores_title = 'In the stores'
stores = '''
<li><span><b>Your address and phone number become public.</b> With the EU Digital Services Act, paid apps show the seller's address, phone and email on the store page. <sup>[14][15]</sup></span></li>'''
fair = '''
<p>It can be done, and many people do it. The forfettario tax is low (5% for the first five years, then 15%), and as a full-time employee I probably wouldn't pay the fixed INPS contribution, which is 4.611,64 € a year for those who have to <sup>[16]</sup>. A few occasional sales can even be declared without a partita IVA, but an app that is on sale all year is hard to call occasional <sup>[17]</sup>.</p>
      <p>What stops me is the number of small fixed tasks, which are the same whether you sell three copies or three thousand.</p>'''
abroad_title = 'How it works in other countries'
abroad_intro = 'The same case: an employee who sells a small app in their free time.'
table_head = '<th>Country</th><th>To start</th><th>Fixed yearly cost</th><th>Simple threshold</th>'
table_rows = '''
<tr class="it"><th>Italy</th><td>Partita IVA, Registro Imprese, PEC, digital signature, VIES</td><td class="bad">Accountant and Chamber fee, plus INPS 4.611,64 € if not exempt</td><td>None, invoices from the first euro</td></tr>
          <tr><th>USA</th><td>Nothing, you sell in your own name</td><td class="good">None</td><td>Self-employment tax only above $400 of profit <sup>[18]</sup></td></tr>
          <tr><th>UK</th><td>Nothing below the allowance, then Self Assessment</td><td class="good">None</td><td>The first £1,000 a year is tax-free <sup>[19]</sup></td></tr>
          <tr><th>Germany</th><td>Gewerbeanmeldung (about 15 to 65 €) and a form on ELSTER</td><td class="good">None for a small side business</td><td>No VAT up to 25.000 € a year <sup>[20]</sup></td></tr>
          <tr><th>France</th><td>Micro-entrepreneur, online</td><td class="good">None, no revenue means no contributions</td><td>No VAT up to 37.500 € for services <sup>[21]</sup></td></tr>
          <tr><th>Spain</th><td>Register as autónomo</td><td class="bad">About 200 € a month (80 € the first year)</td><td>Lower rates for employees <sup>[22]</sup></td></tr>'''
abroad_outro = "Spain is about as heavy as Italy, so it's not only us. I don't think anyone designed this against small developers. The rules were written for shops and professionals, and a hobby with a few sales ends up in the same box."
disclaimer = "I'm not an accountant, and rules and amounts change. If you want to sell an app, talk to a commercialista first. Views are my own."
sources_title = 'Sources'

