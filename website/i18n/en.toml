<details><summary>Is it really free?{{ @icon:expand_more }}</summary>
        <p>Yes, and there is no paid version. If you like it, you can <a href="{{ @url:why }}">support it with a donation</a>.</p></details>
      <details><summary>Where are my songs saved?{{ @icon:expand_more }}</summary>
        <p>On your computer: <code>~/Library/Application Support/SlowDowner</code> on Mac, <code>%APPDATA%\SlowDowner</code> on Windows. The folder still has the app's first name. To move your songs to another computer, use the backup.</p></details>
      <details><summary>Why does macOS block it?{{ @icon:expand_more }}</summary>
        <p>Because it isn't distributed through the App Store. You only need to allow it once, the <a href="{{ @url:mac }}">download page</a> explains how. In the future it will come to the App Store too, and this step won't be needed anymore.</p></details>
