<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS grid: 824 body inside a 1024 canvas. The drop shadow is added by render.swift. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#15181D"/>
  <!-- loop region -->
  <rect x="400" y="290" width="224" height="500" rx="24" fill="#F2A541" fill-opacity="0.18"/>
  <!-- waveform: outside the loop -->
  <g fill="#6B6660">
    <rect x="206" y="465" width="40" height="150" rx="20"/>
    <rect x="268" y="400" width="40" height="280" rx="20"/>
    <rect x="330" y="440" width="40" height="200" rx="20"/>
    <rect x="654" y="370" width="40" height="340" rx="20"/>
    <rect x="716" y="430" width="40" height="220" rx="20"/>
    <rect x="778" y="475" width="40" height="130" rx="20"/>
  </g>
  <!-- waveform: inside the loop -->
  <g fill="#F2A541">
    <rect x="430" y="375" width="40" height="330" rx="20"/>
    <rect x="492" y="330" width="40" height="420" rx="20"/>
    <rect x="554" y="415" width="40" height="250" rx="20"/>
  </g>
  <!-- markers A and B -->
  <g fill="#F2A541">
    <rect x="395" y="270" width="10" height="520" rx="5"/>
    <rect x="366" y="230" width="68" height="52" rx="18"/>
  </g>
  <g fill="#62B6B0">
    <rect x="619" y="270" width="10" height="520" rx="5"/>
    <rect x="590" y="230" width="68" height="52" rx="18"/>
  </g>
</svg>
