# Publishes the site. statichost.eu builds from the branch `site`, not from `main`: this workflow
# moves `site` to the commit of a tag `website-vX.Y.Z` (or to the ref given by hand). A site fix
# is live after a new tag, and ordinary merges to `main` publish nothing.
name: Site

on:
  push:
    tags: ['website-v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to publish
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Move the site branch
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Publishing $sha"
          git push origin "$sha:refs/heads/site" --force
